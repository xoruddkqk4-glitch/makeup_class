<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>보강 알리미 | 온라인 교무실</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary-color: #006b67;       /* 보강 목록 헤더 청록색 */
      --primary-hover: #00524f;
      --primary-light: #e6f4f1;       /* 테이블 짝수행 연한 민트 */
      --primary-border: #b2dfdb;
      --accent-color: #0d9488;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --bg-canvas: #f8fafc;
      --card-bg: #ffffff;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.1);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-main);
      line-height: 1.5;
      padding: 16px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* 상단 대시보드 헤더 */
    .app-header {
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 8px;
    }

    .app-title {
      font-size: 2.1rem;
      font-weight: 700;
      color: var(--primary-color);
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .app-subtitle {
      font-size: 1.05rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 8px;
    }

    .notice-banner {
      display: inline-block;
      font-size: 0.875rem;
      color: #475569;
      background: #f1f5f9;
      padding: 5px 16px;
      border-radius: 20px;
      border: 1px solid #e2e8f0;
    }

    /* 상단 조작 패널 */
    .control-panel {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 16px 20px;
      box-shadow: var(--shadow-sm);
      border: 1px solid #cbd5e1;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .left-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .range-picker-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      padding: 5px 10px;
      border-radius: 6px;
    }

    .range-picker-wrap input[type="date"] {
      border: none;
      background: transparent;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-main);
      outline: none;
      cursor: pointer;
    }

    .date-separator {
      font-weight: 700;
      color: #64748b;
      font-size: 0.85rem;
    }

    .btn-group {
      display: flex;
      gap: 4px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-primary {
      background-color: var(--primary-color);
      color: #ffffff;
      box-shadow: 0 2px 4px rgba(0, 107, 103, 0.25);
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-outline {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #334155;
    }

    .btn-outline:hover {
      background: #f1f5f9;
      border-color: #94a3b8;
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: 0.825rem;
    }

    .btn-sm.active {
      background: var(--primary-light);
      border-color: var(--primary-color);
      color: var(--primary-color);
    }

    /* 보강 목록 테이블 컨테이너 */
    .table-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      border: 1px solid #cbd5e1;
      overflow: hidden;
    }

    .table-header-title {
      background: #f1f5f9;
      padding: 14px 20px;
      font-size: 1.05rem;
      font-weight: 700;
      color: #1e293b;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .table-responsive {
      width: 100%;
      overflow-x: auto;
    }

    .schedule-table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
    }

    .schedule-table th {
      background-color: var(--primary-color);
      color: #ffffff;
      font-weight: 600;
      font-size: 0.925rem;
      padding: 12px 8px;
      border: 1px solid #005753;
      white-space: nowrap;
    }

    /* 열별 개별 필터 헤더 행 */
    .filter-header-row th {
      background-color: #f8fafc;
      padding: 6px;
      border: 1px solid #e2e8f0;
    }

    .col-filter-input, .col-filter-select {
      width: 100%;
      padding: 5px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-size: 0.825rem;
      outline: none;
      background: #ffffff;
      color: var(--text-main);
      transition: border-color 0.2s;
    }

    .col-filter-input:focus, .col-filter-select:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 2px rgba(0, 107, 103, 0.15);
    }

    .schedule-table td {
      padding: 12px 8px;
      border: 1px solid #e2e8f0;
      font-size: 0.925rem;
      color: var(--text-main);
      vertical-align: middle;
    }

    .schedule-table tr:nth-child(even) {
      background-color: var(--primary-light);
    }

    .schedule-table tr:hover {
      background-color: #d1ebe5;
    }

    /* 뱃지 및 스타일링 */
    .badge-period {
      display: inline-block;
      background: #0284c7;
      color: #fff;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 12px;
    }

    .badge-class {
      display: inline-block;
      background: #475569;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 6px;
    }

    .teacher-sub {
      color: #047857;
      font-weight: 700;
      font-size: 1.02rem;
    }

    .teacher-orig {
      color: #e11d48;
      font-weight: 600;
    }

    .badge-reason {
      display: inline-block;
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
    }

    /* 작업 전용 아이콘 버튼 */
    .action-btns {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }

    .btn-icon-edit {
      background: #eff6ff;
      color: #2563eb;
      border-color: #bfdbfe;
    }

    .btn-icon-edit:hover {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
      box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
    }

    .btn-icon-delete {
      background: #fef2f2;
      color: #ef4444;
      border-color: #fecaca;
    }

    .btn-icon-delete:hover {
      background: #ef4444;
      color: #ffffff;
      border-color: #ef4444;
      box-shadow: 0 2px 4px rgba(239, 68, 68, 0.2);
    }

    /* 빈 상태 */
    .empty-state {
      padding: 48px 20px;
      text-align: center;
      color: var(--text-muted);
    }

    .empty-state i {
      font-size: 2.5rem;
      color: #cbd5e1;
      margin-bottom: 12px;
    }

    .empty-state p {
      font-size: 0.95rem;
      font-weight: 500;
    }

    /* 모달 스타일 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s ease;
      padding: 16px;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-card {
      background: #ffffff;
      border-radius: 12px;
      width: 100%;
      max-width: 540px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      transform: translateY(20px);
      transition: transform 0.25s ease;
    }

    .modal-overlay.active .modal-card {
      transform: translateY(0);
    }

    .modal-header {
      background: var(--primary-color);
      color: #ffffff;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-header h3 {
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-close-btn {
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 1.25rem;
      cursor: pointer;
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    .modal-close-btn:hover { opacity: 1; }

    .modal-body {
      padding: 24px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.9rem;
      font-weight: 700;
      color: #334155;
      margin-bottom: 6px;
    }

    .form-label .step-title {
      display: flex;
      align-items: center;
    }

    .form-label .step-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      background: var(--primary-light);
      color: var(--primary-color);
      border-radius: 50%;
      font-size: 0.75rem;
      margin-right: 6px;
    }

    .form-control {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-control:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(0, 107, 103, 0.12);
    }

    /* 교시 선택 칩 */
    .period-chips {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .period-chip {
      text-align: center;
      padding: 8px 0;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #f8fafc;
      font-size: 0.85rem;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .period-chip.selected {
      background: var(--primary-color);
      color: #ffffff;
      border-color: var(--primary-color);
      box-shadow: 0 2px 4px rgba(0, 107, 103, 0.2);
    }

    .class-select-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* 사유 태그 관리 스타일 */
    .reason-tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .reason-chip-tag {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.8rem;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: #475569;
      padding: 4px 10px;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }

    .reason-chip-tag:hover {
      background: var(--primary-light);
      border-color: var(--primary-border);
      color: var(--primary-color);
    }

    .reason-chip-tag .btn-tag-del {
      font-size: 0.75rem;
      color: #94a3b8;
      border-radius: 50%;
      width: 14px;
      height: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-left: 2px;
    }

    .reason-chip-tag .btn-tag-del:hover {
      color: #ef4444;
      background: #fee2e2;
    }

    .btn-add-tag-chip {
      font-size: 0.8rem;
      background: #ffffff;
      border: 1px dashed var(--primary-color);
      color: var(--primary-color);
      padding: 4px 10px;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.15s ease;
    }

    .btn-add-tag-chip:hover {
      background: var(--primary-light);
    }

    .modal-footer {
      padding: 16px 24px;
      background: #f8fafc;
      border-top: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
    }

    .spinner {
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top: 3px solid #ffffff;
      width: 16px;
      height: 16px;
      animation: spin 0.8s linear infinite;
      display: inline-block;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
      .app-title { font-size: 1.6rem; }
      .control-panel { flex-direction: column; align-items: stretch; }
      .left-controls { flex-direction: column; align-items: stretch; }
      .period-chips { grid-template-columns: repeat(4, 1fr); }
      .schedule-table th, .schedule-table td { padding: 10px 4px; font-size: 0.825rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 헤더 영역 -->
    <header class="app-header">
      <h1 class="app-title">
        <i class="fa-solid fa-clipboard-user"></i> 보강 알리미
      </h1>
      <div class="app-subtitle">온라인 교무실 보강 현황판</div>
      <div class="notice-banner">
        <i class="fa-solid fa-circle-info"></i> ※ 보강 정보 등록, 수정, 삭제는 모든 선생님께서 자유롭게 하실 수 있습니다.
      </div>
    </header>

    <!-- 상단 조작 패널 (기간 검색 및 오늘/이번주/이번달 버튼) -->
    <section class="control-panel">
      <div class="left-controls">
        <div class="range-picker-wrap">
          <i class="fa-regular fa-calendar-days" style="color: var(--primary-color);"></i>
          <input type="date" id="filterStartDate">
          <span class="date-separator">~</span>
          <input type="date" id="filterEndDate">
        </div>

        <button class="btn btn-outline btn-sm" onclick="loadRecords()">
          <i class="fa-solid fa-magnifying-glass"></i> 조회
        </button>

        <div class="btn-group">
          <button class="btn btn-outline btn-sm" id="btnToday" onclick="setTodayDate()">오늘</button>
          <button class="btn btn-outline btn-sm" id="btnThisWeek" onclick="setThisWeekDate()">이번 주</button>
          <button class="btn btn-outline btn-sm" id="btnThisMonth" onclick="setThisMonthDate()">이번 달</button>
          <button class="btn btn-outline btn-sm" id="btnAll" onclick="setAllDate()">전체 보기</button>
        </div>
      </div>

      <div>
        <button class="btn btn-primary" onclick="openAddModal()">
          <i class="fa-solid fa-plus"></i> 보강 등록하기
        </button>
      </div>
    </section>

    <!-- 메인 보강 목록 테이블 (드롭다운 & 열별 필터 적용) -->
    <main class="table-card">
      <div class="table-header-title">
        <span><i class="fa-solid fa-table-list" style="color: var(--primary-color);"></i> 보강 목록</span>
        <span id="currentDateLabel" style="font-size: 0.9rem; font-weight: 500; color: #64748b;"></span>
      </div>

      <div class="table-responsive">
        <table class="schedule-table">
          <thead>
            <tr>
              <th style="width: 16%;">날짜(요일)</th>
              <th style="width: 10%;">교시</th>
              <th style="width: 17%;">학급</th>
              <th style="width: 17%;">보강 교사</th>
              <th style="width: 17%;">보강 사유</th>
              <th style="width: 17%;">결강 교사(원교사)</th>
              <th style="width: 6%;">작업</th>
            </tr>
            <!-- 열별 개별 필터 헤더 행 -->
            <tr class="filter-header-row">
              <th><!-- 상단 기간 검색이 존재하므로 날짜 열은 빈칸으로 정돈 --></th>
              <th>
                <select class="col-filter-select" id="filterColPeriod" onchange="applyColumnFilters()">
                  <option value="">전체 교시</option>
                  <option value="1교시">1교시</option>
                  <option value="2교시">2교시</option>
                  <option value="3교시">3교시</option>
                  <option value="4교시">4교시</option>
                  <option value="5교시">5교시</option>
                  <option value="6교시">6교시</option>
                  <option value="7교시">7교시</option>
                </select>
              </th>
              <th>
                <!-- 학년별 및 학급별 드롭다운 선택 -->
                <select class="col-filter-select" id="filterColClass" onchange="applyColumnFilters()">
                  <option value="">전체 학급</option>
                  <optgroup label="1학년">
                    <option value="1학년">1학년 전체</option>
                    <option value="1학년 1반">1학년 1반</option>
                    <option value="1학년 2반">1학년 2반</option>
                    <option value="1학년 3반">1학년 3반</option>
                    <option value="1학년 4반">1학년 4반</option>
                    <option value="1학년 5반">1학년 5반</option>
                    <option value="1학년 6반">1학년 6반</option>
                    <option value="1학년 7반">1학년 7반</option>
                    <option value="1학년 8반">1학년 8반</option>
                    <option value="1학년 9반">1학년 9반</option>
                  </optgroup>
                  <optgroup label="2학년">
                    <option value="2학년">2학년 전체</option>
                    <option value="2학년 1반">2학년 1반</option>
                    <option value="2학년 2반">2학년 2반</option>
                    <option value="2학년 3반">2학년 3반</option>
                    <option value="2학년 4반">2학년 4반</option>
                    <option value="2학년 5반">2학년 5반</option>
                    <option value="2학년 6반">2학년 6반</option>
                    <option value="2학년 7반">2학년 7반</option>
                    <option value="2학년 8반">2학년 8반</option>
                    <option value="2학년 9반">2학년 9반</option>
                  </optgroup>
                  <optgroup label="3학년">
                    <option value="3학년">3학년 전체</option>
                    <option value="3학년 1반">3학년 1반</option>
                    <option value="3학년 2반">3학년 2반</option>
                    <option value="3학년 3반">3학년 3반</option>
                    <option value="3학년 4반">3학년 4반</option>
                    <option value="3학년 5반">3학년 5반</option>
                    <option value="3학년 6반">3학년 6반</option>
                    <option value="3학년 7반">3학년 7반</option>
                    <option value="3학년 8반">3학년 8반</option>
                    <option value="3학년 9반">3학년 9반</option>
                  </optgroup>
                </select>
              </th>
              <th>
                <input type="text" class="col-filter-input" id="filterColSubTeacher" placeholder="보강교사 검색..." onkeyup="applyColumnFilters()">
              </th>
              <th>
                <!-- 사유 드롭다운 선택 -->
                <select class="col-filter-select" id="filterColReason" onchange="applyColumnFilters()">
                  <option value="">전체 사유</option>
                  <!-- JavaScript 동적 생성 -->
                </select>
              </th>
              <th>
                <input type="text" class="col-filter-input" id="filterColOrigTeacher" placeholder="원교사 검색..." onkeyup="applyColumnFilters()">
              </th>
              <th>
                <!-- 필터 초기화 명확한 버튼 -->
                <button class="btn btn-outline btn-sm" style="padding: 3px 8px; font-size: 0.775rem; white-space: nowrap;" title="모든 열 필터 초기화" onclick="resetColumnFilters()">
                  <i class="fa-solid fa-rotate-left"></i> 초기화
                </button>
              </th>
            </tr>
          </thead>
          <tbody id="recordTableBody">
            <!-- JavaScript 데이터 동적 생성 -->
          </tbody>
        </table>

        <!-- 빈 상태 표시 -->
        <div id="emptyState" class="empty-state" style="display: none;">
          <i class="fa-regular fa-folder-open"></i>
          <p id="emptyStateText">등록된 보강 내역이 없습니다.</p>
        </div>
      </div>
    </main>
  </div>

  <!-- 보강 등록/수정 모달 팝업 -->
  <div class="modal-overlay" id="addModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modalTitle"><i class="fa-solid fa-pen-to-square"></i> 보강 내역 등록</h3>
        <button class="modal-close-btn" onclick="closeAddModal()">&times;</button>
      </div>
      
      <form id="addForm" onsubmit="handleFormSubmit(event)">
        <input type="hidden" id="editingRecordId" value="">
        <div class="modal-body">
          
          <!-- 1. 날짜 지정 -->
          <div class="form-group">
            <label class="form-label">
              <span class="step-title"><span class="step-num">1</span> 날짜 지정</span>
            </label>
            <input type="date" class="form-control" id="inputDate" required>
          </div>

          <!-- 2. 교시 선택 -->
          <div class="form-group">
            <label class="form-label">
              <span class="step-title"><span class="step-num">2</span> 교시 선택 (1~7교시)</span>
            </label>
            <div class="period-chips" id="periodChips">
              <div class="period-chip selected" onclick="selectPeriod(1)">1교시</div>
              <div class="period-chip" onclick="selectPeriod(2)">2교시</div>
              <div class="period-chip" onclick="selectPeriod(3)">3교시</div>
              <div class="period-chip" onclick="selectPeriod(4)">4교시</div>
              <div class="period-chip" onclick="selectPeriod(5)">5교시</div>
              <div class="period-chip" onclick="selectPeriod(6)">6교시</div>
              <div class="period-chip" onclick="selectPeriod(7)">7교시</div>
            </div>
            <input type="hidden" id="inputPeriod" value="1교시">
          </div>

          <!-- 3. 학급 선택 -->
          <div class="form-group">
            <label class="form-label">
              <span class="step-title"><span class="step-num">3</span> 학급 선택</span>
            </label>
            <div class="class-select-grid">
              <select class="form-control" id="inputGrade">
                <option value="1학년">1학년</option>
                <option value="2학년">2학년</option>
                <option value="3학년">3학년</option>
              </select>
              <select class="form-control" id="inputClass">
                <!-- 1반 ~ 9반 자동 생성 -->
              </select>
            </div>
          </div>

          <!-- 4. 보강 교사 -->
          <div class="form-group">
            <label class="form-label">
              <span class="step-title"><span class="step-num">4</span> 보강 교사 (보강 들어갈 교사 이름 입력)</span>
            </label>
            <input type="text" class="form-control" id="inputSubstituteTeacher" placeholder="예: 김철수" required>
          </div>

          <!-- 5. 보강 사유 (사용자가 추가/삭제 가능한 퀵 태그) -->
          <div class="form-group">
            <label class="form-label">
              <span class="step-title"><span class="step-num">5</span> 보강 유발 사유</span>
            </label>
            <input type="text" class="form-control" id="inputReason" placeholder="예: 관외 출장, 연가 등" required>
            <div class="reason-tags-container" id="reasonTagsContainer">
              <!-- 동적 태그 칩 생성 -->
            </div>
          </div>

          <!-- 6. 결강 교사(원교사) -->
          <div class="form-group">
            <label class="form-label">
              <span class="step-title"><span class="step-num">6</span> 결강 교사 (원교사 이름 입력)</span>
            </label>
            <input type="text" class="form-control" id="inputOriginalTeacher" placeholder="예: 홍길동" required>
          </div>

        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-outline" onclick="closeAddModal()">취소</button>
          <button type="submit" class="btn btn-primary" id="btnSubmit">
            <span id="btnSubmitText">등록하기</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let currentRecords = [];
    let isGasEnvironment = typeof google !== 'undefined' && google.script && google.script.run;

    // 기본 보강 사유 태그 목록 (조퇴, 외출 분리 완료)
    const DEFAULT_REASON_TAGS = ['출장', '연가', '병가', '공가', '특별휴가', '조퇴', '외출'];
    let reasonTags = [];

    // 모의(Mock) 데이터 (로컬 테스트용)
    const mockData = [
      { id: 'SUB-1', date: '2026-09-02', period: '2교시', className: '1학년 3반', originalTeacher: '홍길동', substituteTeacher: '김철수', reason: '출장' },
      { id: 'SUB-2', date: '2026-09-02', period: '3교시', className: '2학년 5반', originalTeacher: '이영희', substituteTeacher: '박민수', reason: '연가' },
      { id: 'SUB-3', date: '2026-09-03', period: '5교시', className: '3학년 1반', originalTeacher: '강감찬', substituteTeacher: '최무선', reason: '공가' }
    ];

    document.addEventListener('DOMContentLoaded', function() {
      initReasonTags();
      initClassOptions();
      setTodayDate();
    });

    // 사유 태그 초기화 및 로컬스토리지 관리
    function initReasonTags() {
      const saved = localStorage.getItem('custom_reason_tags');
      if (saved) {
        try {
          reasonTags = JSON.parse(saved);
        } catch (e) {
          reasonTags = [...DEFAULT_REASON_TAGS];
        }
      } else {
        reasonTags = [...DEFAULT_REASON_TAGS];
      }
      renderReasonTags();
      populateReasonFilterDropdown();
    }

    function saveReasonTags() {
      localStorage.setItem('custom_reason_tags', JSON.stringify(reasonTags));
      renderReasonTags();
      populateReasonFilterDropdown();
    }

    function renderReasonTags() {
      const container = document.getElementById('reasonTagsContainer');
      container.innerHTML = '';

      reasonTags.forEach(tag => {
        const chip = document.createElement('span');
        chip.className = 'reason-chip-tag';
        chip.innerHTML = `#${escapeHtml(tag)} <span class="btn-tag-del" title="태그 삭제" onclick="deleteReasonTag(event, '${escapeHtml(tag)}')">&times;</span>`;
        chip.onclick = function() {
          setReason(tag);
        };
        container.appendChild(chip);
      });

      // 태그 추가 버튼
      const addBtn = document.createElement('span');
      addBtn.className = 'btn-add-tag-chip';
      addBtn.innerHTML = `<i class="fa-solid fa-plus"></i> 태그 추가`;
      addBtn.onclick = function(e) {
        e.stopPropagation();
        addNewReasonTag();
      };
      container.appendChild(addBtn);
    }

    function addNewReasonTag() {
      const newTag = prompt('새로 추가할 보강 사유 태그를 입력하세요:');
      if (newTag && newTag.trim()) {
        const cleanTag = newTag.trim();
        if (!reasonTags.includes(cleanTag)) {
          reasonTags.push(cleanTag);
          saveReasonTags();
        }
      }
    }

    function deleteReasonTag(e, tagToDelete) {
      e.stopPropagation();
      if (confirm(`'#${tagToDelete}' 태그를 삭제하시겠습니까?`)) {
        reasonTags = reasonTags.filter(t => t !== tagToDelete);
        saveReasonTags();
      }
    }

    // 사유 필터 드롭다운 채우기
    function populateReasonFilterDropdown() {
      const select = document.getElementById('filterColReason');
      const currentVal = select.value;
      select.innerHTML = '<option value="">전체 사유</option>';

      reasonTags.forEach(tag => {
        const opt = document.createElement('option');
        opt.value = tag;
        opt.textContent = tag;
        select.appendChild(opt);
      });

      select.value = currentVal;
    }

    function getTodayDateObj() {
      return new Date();
    }

    function formatDateToString(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function setActiveQuickBtn(activeId) {
      ['btnToday', 'btnThisWeek', 'btnThisMonth', 'btnAll'].forEach(id => {
        const btn = document.getElementById(id);
        if (btn) {
          if (id === activeId) btn.classList.add('active');
          else btn.classList.remove('active');
        }
      });
    }

    function setTodayDate() {
      const todayStr = formatDateToString(getTodayDateObj());
      document.getElementById('filterStartDate').value = todayStr;
      document.getElementById('filterEndDate').value = todayStr;
      document.getElementById('inputDate').value = todayStr;
      setActiveQuickBtn('btnToday');
      loadRecords();
    }

    function setThisWeekDate() {
      const now = getTodayDateObj();
      const dayOfWeek = now.getDay();
      const distanceToMon = (dayOfWeek === 0 ? -6 : 1 - dayOfWeek);
      
      const mon = new Date(now);
      mon.setDate(now.getDate() + distanceToMon);

      const sun = new Date(mon);
      sun.setDate(mon.getDate() + 6);

      document.getElementById('filterStartDate').value = formatDateToString(mon);
      document.getElementById('filterEndDate').value = formatDateToString(sun);
      setActiveQuickBtn('btnThisWeek');
      loadRecords();
    }

    function setThisMonthDate() {
      const now = getTodayDateObj();
      const firstDay = new Date(now.getFullYear(), now.getMonth(), 1);
      const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0);

      document.getElementById('filterStartDate').value = formatDateToString(firstDay);
      document.getElementById('filterEndDate').value = formatDateToString(lastDay);
      setActiveQuickBtn('btnThisMonth');
      loadRecords();
    }

    function setAllDate() {
      document.getElementById('filterStartDate').value = '';
      document.getElementById('filterEndDate').value = '';
      setActiveQuickBtn('btnAll');
      loadRecords();
    }

    function initClassOptions() {
      const classSelect = document.getElementById('inputClass');
      classSelect.innerHTML = '';
      for (let i = 1; i <= 9; i++) {
        const option = document.createElement('option');
        option.value = `${i}반`;
        option.textContent = `${i}반`;
        classSelect.appendChild(option);
      }
    }

    function selectPeriod(periodNum) {
      const chips = document.querySelectorAll('.period-chip');
      chips.forEach((chip, idx) => {
        if (idx === periodNum - 1) {
          chip.classList.add('selected');
        } else {
          chip.classList.remove('selected');
        }
      });
      document.getElementById('inputPeriod').value = `${periodNum}교시`;
    }

    function setReason(reasonText) {
      document.getElementById('inputReason').value = reasonText;
    }

    // 보강 내역 불러오기
    function loadRecords() {
      const startDate = document.getElementById('filterStartDate').value;
      const endDate = document.getElementById('filterEndDate').value;
      
      updateDateLabel(startDate, endDate);

      if (isGasEnvironment) {
        google.script.run
          .withSuccessHandler(function(records) {
            currentRecords = records;
            applyColumnFilters();
          })
          .withFailureHandler(function(err) {
            alert('데이터를 불러오는데 실패했습니다: ' + err.message);
          })
          .getSubstitutionRecords(startDate || 'ALL', endDate);
      } else {
        setTimeout(() => {
          if (!startDate && !endDate) {
            currentRecords = [...mockData];
          } else if (startDate && endDate) {
            currentRecords = mockData.filter(r => r.date >= startDate && r.date <= endDate);
          } else if (startDate) {
            currentRecords = mockData.filter(r => r.date === startDate);
          } else {
            currentRecords = [...mockData];
          }
          applyColumnFilters();
        }, 100);
      }
    }

    function updateDateLabel(startDate, endDate) {
      const label = document.getElementById('currentDateLabel');
      if (!startDate && !endDate) {
        label.textContent = '[ 전체 보강 목록 ]';
      } else if (startDate && endDate) {
        if (startDate === endDate) {
          label.textContent = `[ ${formatFormattedDate(startDate)} 보강 목록 ]`;
        } else {
          label.textContent = `[ ${formatFormattedDate(startDate)} ~ ${formatFormattedDate(endDate)} 보강 목록 ]`;
        }
      } else {
        label.textContent = `[ ${formatFormattedDate(startDate)} 보강 목록 ]`;
      }
    }

    function formatFormattedDate(rawDateStr) {
      if (!rawDateStr) return '';
      let dateObj = null;

      const match = String(rawDateStr).trim().match(/^(\d{4})[-.\/]?(\d{2})[-.\/]?(\d{2})/);
      if (match) {
        const y = match[1];
        const m = match[2];
        const d = match[3];
        dateObj = new Date(parseInt(y), parseInt(m) - 1, parseInt(d));
        const days = ['일', '월', '화', '수', '목', '금', '토'];
        const dayStr = days[dateObj.getDay()];
        return `${y}-${m}-${d} (${dayStr})`;
      }

      dateObj = new Date(rawDateStr);
      if (!isNaN(dateObj.getTime())) {
        const y = dateObj.getFullYear();
        const m = String(dateObj.getMonth() + 1).padStart(2, '0');
        const d = String(dateObj.getDate()).padStart(2, '0');
        const days = ['일', '월', '화', '수', '목', '금', '토'];
        const dayStr = days[dateObj.getDay()];
        return `${y}-${m}-${d} (${dayStr})`;
      }

      return rawDateStr;
    }

    // 열별 개별 필터링
    function applyColumnFilters() {
      const periodQuery = document.getElementById('filterColPeriod').value.trim();
      const classQuery = document.getElementById('filterColClass').value.trim();
      const subTeacherQuery = document.getElementById('filterColSubTeacher').value.toLowerCase().trim();
      const reasonQuery = document.getElementById('filterColReason').value.toLowerCase().trim();
      const origTeacherQuery = document.getElementById('filterColOrigTeacher').value.toLowerCase().trim();

      const filtered = currentRecords.filter(r => {
        if (periodQuery && r.period !== periodQuery) return false;
        if (classQuery && !r.className.includes(classQuery)) return false;
        if (subTeacherQuery && !r.substituteTeacher.toLowerCase().includes(subTeacherQuery)) return false;
        if (reasonQuery && !r.reason.toLowerCase().includes(reasonQuery)) return false;
        if (origTeacherQuery && !r.originalTeacher.toLowerCase().includes(origTeacherQuery)) return false;
        return true;
      });

      renderTable(filtered);
    }

    function resetColumnFilters() {
      document.getElementById('filterColPeriod').value = '';
      document.getElementById('filterColClass').value = '';
      document.getElementById('filterColSubTeacher').value = '';
      document.getElementById('filterColReason').value = '';
      document.getElementById('filterColOrigTeacher').value = '';
      renderTable(currentRecords);
    }

    // 테이블 렌더링
    function renderTable(records) {
      const tbody = document.getElementById('recordTableBody');
      const emptyState = document.getElementById('emptyState');
      tbody.innerHTML = '';

      if (!records || records.length === 0) {
        emptyState.style.display = 'block';
        return;
      }

      emptyState.style.display = 'none';

      records.forEach(item => {
        const tr = document.createElement('tr');
        const formattedDateText = formatFormattedDate(item.date);
        
        tr.innerHTML = `
          <td style="font-weight: 600;">${formattedDateText}</td>
          <td><span class="badge-period">${escapeHtml(item.period)}</span></td>
          <td><span class="badge-class">${escapeHtml(item.className)}</span></td>
          <td><span class="teacher-sub">${escapeHtml(item.substituteTeacher)}</span></td>
          <td><span class="badge-reason">${escapeHtml(item.reason)}</span></td>
          <td><span class="teacher-orig">${escapeHtml(item.originalTeacher)}</span></td>
          <td>
            <div class="action-btns">
              <button class="btn-icon btn-icon-edit" title="수정" onclick="openEditModal('${item.id}')">
                <i class="fa-solid fa-pen-to-square"></i>
              </button>
              <button class="btn-icon btn-icon-delete" title="삭제" onclick="deleteRecord('${item.id}')">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 모달 제어
    function openAddModal() {
      document.getElementById('editingRecordId').value = '';
      document.getElementById('modalTitle').innerHTML = `<i class="fa-solid fa-pen-to-square"></i> 보강 내역 등록`;
      document.getElementById('btnSubmitText').textContent = '등록하기';
      resetForm();
      document.getElementById('addModal').classList.add('active');
    }

    function openEditModal(id) {
      const target = currentRecords.find(r => String(r.id) === String(id));
      if (!target) return;

      document.getElementById('editingRecordId').value = target.id;
      document.getElementById('modalTitle').innerHTML = `<i class="fa-solid fa-pen-to-square"></i> 보강 내역 수정`;
      document.getElementById('btnSubmitText').textContent = '수정 완료';

      let dateVal = target.date;
      const match = String(target.date).match(/^(\d{4})[-.\/]?(\d{2})[-.\/]?(\d{2})/);
      if (match) dateVal = `${match[1]}-${match[2]}-${match[3]}`;
      document.getElementById('inputDate').value = dateVal;

      const periodNum = parseInt(target.period) || 1;
      selectPeriod(periodNum);

      const classParts = target.className.split(' ');
      if (classParts.length >= 2) {
        document.getElementById('inputGrade').value = classParts[0];
        document.getElementById('inputClass').value = classParts[1];
      }

      document.getElementById('inputSubstituteTeacher').value = target.substituteTeacher;
      document.getElementById('inputReason').value = target.reason;
      document.getElementById('inputOriginalTeacher').value = target.originalTeacher;

      document.getElementById('addModal').classList.add('active');
    }

    function closeAddModal() {
      document.getElementById('addModal').classList.remove('active');
    }

    // 폼 제출
    function handleFormSubmit(e) {
      e.preventDefault();

      const editingId = document.getElementById('editingRecordId').value;
      const date = document.getElementById('inputDate').value;
      const period = document.getElementById('inputPeriod').value;
      const grade = document.getElementById('inputGrade').value;
      const classNum = document.getElementById('inputClass').value;
      const substituteTeacher = document.getElementById('inputSubstituteTeacher').value.trim();
      const reason = document.getElementById('inputReason').value.trim();
      const originalTeacher = document.getElementById('inputOriginalTeacher').value.trim();

      if (!date || !period || !originalTeacher || !substituteTeacher) {
        alert('필수 정보를 모두 입력해 주세요.');
        return;
      }

      const record = {
        id: editingId,
        date: date,
        period: period,
        className: `${grade} ${classNum}`,
        substituteTeacher: substituteTeacher,
        reason: reason || '사유 없음',
        originalTeacher: originalTeacher
      };

      setSubmittingState(true, editingId ? '수정 중...' : '저장 중...');

      if (editingId) {
        if (isGasEnvironment) {
          google.script.run
            .withSuccessHandler(function(res) {
              setSubmittingState(false);
              if (res.success) {
                closeAddModal();
                loadRecords();
              } else {
                alert('수정 실패: ' + res.message);
              }
            })
            .withFailureHandler(function(err) {
              setSubmittingState(false);
              alert('수정 중 오류가 발생했습니다: ' + err.message);
            })
            .updateSubstitutionRecord(record);
        } else {
          setTimeout(() => {
            setSubmittingState(false);
            const idx = mockData.findIndex(r => r.id === editingId);
            if (idx !== -1) mockData[idx] = { ...record };
            closeAddModal();
            loadRecords();
          }, 300);
        }
      } else {
        if (isGasEnvironment) {
          google.script.run
            .withSuccessHandler(function(res) {
              setSubmittingState(false);
              if (res.success) {
                closeAddModal();
                document.getElementById('filterStartDate').value = date;
                document.getElementById('filterEndDate').value = date;
                loadRecords();
              } else {
                alert('저장 실패: ' + res.message);
              }
            })
            .withFailureHandler(function(err) {
              setSubmittingState(false);
              alert('저장 중 오류가 발생했습니다: ' + err.message);
            })
            .addSubstitutionRecord(record);
        } else {
          setTimeout(() => {
            setSubmittingState(false);
            const newId = 'SUB-' + Date.now();
            mockData.unshift({ ...record, id: newId });
            closeAddModal();
            document.getElementById('filterStartDate').value = date;
            document.getElementById('filterEndDate').value = date;
            loadRecords();
          }, 300);
        }
      }
    }

    function setSubmittingState(isSubmitting, labelText) {
      const btn = document.getElementById('btnSubmit');
      const textSpan = document.getElementById('btnSubmitText');
      if (isSubmitting) {
        btn.disabled = true;
        textSpan.innerHTML = `<span class="spinner"></span> ${labelText}`;
      } else {
        btn.disabled = false;
        textSpan.innerHTML = document.getElementById('editingRecordId').value ? '수정 완료' : '등록하기';
      }
    }

    function resetForm() {
      const todayStr = formatDateToString(getTodayDateObj());
      document.getElementById('inputDate').value = todayStr;
      document.getElementById('inputSubstituteTeacher').value = '';
      document.getElementById('inputReason').value = '';
      document.getElementById('inputOriginalTeacher').value = '';
      selectPeriod(1);
    }

    function deleteRecord(id) {
      if (!confirm('해당 보강 내역을 삭제하시겠습니까?')) return;

      if (isGasEnvironment) {
        google.script.run
          .withSuccessHandler(function(res) {
            if (res.success) {
              loadRecords();
            } else {
              alert('삭제 실패: ' + res.message);
            }
          })
          .withFailureHandler(function(err) {
            alert('삭제 시 오류가 발생했습니다: ' + err.message);
          })
          .deleteSubstitutionRecord(id);
      } else {
        const idx = mockData.findIndex(r => r.id === id);
        if (idx !== -1) mockData.splice(idx, 1);
        loadRecords();
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
