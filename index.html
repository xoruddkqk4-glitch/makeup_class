<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>홍익-보강 알리미 | 온라인 교무실</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary-color: #006b67;       /* 교사 지도표 헤더 깊은 청록색 */
      --primary-hover: #00524f;
      --primary-light: #e6f4f1;       /* 테이블 짝수행/배경 연한 민트 */
      --primary-border: #b2dfdb;
      --accent-color: #0d9488;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --bg-canvas: #f8fafc;
      --card-bg: #ffffff;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.1);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-main);
      line-height: 1.5;
      padding: 16px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* 상단 대시보드 헤더 */
    .app-header {
      text-align: center;
      margin-bottom: 24px;
      padding-bottom: 12px;
    }

    .app-title {
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary-color);
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .app-subtitle {
      font-size: 1.1rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 8px;
    }

    .notice-banner {
      display: inline-block;
      font-size: 0.9rem;
      color: #475569;
      background: #f1f5f9;
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid #e2e8f0;
    }

    /* 상단 컨트롤 바 */
    .control-panel {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 16px 20px;
      box-shadow: var(--shadow-sm);
      border: 1px solid #e2e8f0;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .left-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .date-picker-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 500;
    }

    .date-picker-wrap input[type="date"] {
      border: none;
      background: transparent;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
      outline: none;
      cursor: pointer;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background-color: var(--primary-color);
      color: #ffffff;
      box-shadow: 0 2px 4px rgba(0, 107, 103, 0.25);
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-outline {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #334155;
    }

    .btn-outline:hover {
      background: #f1f5f9;
      border-color: #94a3b8;
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: 0.825rem;
    }

    .search-wrap {
      position: relative;
    }

    .search-wrap input {
      padding: 8px 12px 8px 34px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
      width: 180px;
      transition: width 0.2s, border-color 0.2s;
    }

    .search-wrap input:focus {
      width: 220px;
      border-color: var(--primary-color);
    }

    .search-wrap i {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      font-size: 0.85rem;
    }

    /* 현황 카드/표 컨테이너 (첨부 이미지 교사 지도표 스타일 반영) */
    .table-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      border: 1px solid #cbd5e1;
      overflow: hidden;
    }

    .table-header-title {
      background: #f1f5f9;
      padding: 14px 20px;
      font-size: 1.05rem;
      font-weight: 700;
      color: #1e293b;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .table-responsive {
      width: 100%;
      overflow-x: auto;
    }

    .schedule-table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
    }

    .schedule-table th {
      background-color: var(--primary-color);
      color: #ffffff;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 14px 12px;
      border: 1px solid #005753;
      white-space: nowrap;
    }

    .schedule-table td {
      padding: 14px 12px;
      border: 1px solid #e2e8f0;
      font-size: 0.95rem;
      color: var(--text-main);
      vertical-align: middle;
    }

    .schedule-table tr:nth-child(even) {
      background-color: var(--primary-light);
    }

    .schedule-table tr:hover {
      background-color: #d1ebe5;
    }

    /* 뱃지 및 상태 표기 */
    .badge-period {
      display: inline-block;
      background: #0284c7;
      color: #fff;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 12px;
    }

    .badge-class {
      display: inline-block;
      background: #475569;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 6px;
    }

    .teacher-flow {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 600;
    }

    .teacher-orig {
      color: #e11d48; /* 결강 교사 빨강/장미색 포인트 */
      text-decoration: line-through;
      font-weight: 500;
    }

    .arrow-icon {
      color: var(--primary-color);
      font-size: 0.85rem;
    }

    .teacher-sub {
      color: #047857; /* 보강 교사 초록 포인트 */
      font-weight: 700;
      font-size: 1.02rem;
    }

    .badge-reason {
      display: inline-block;
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
    }

    .btn-delete {
      background: transparent;
      color: #ef4444;
      border: none;
      cursor: pointer;
      padding: 6px;
      border-radius: 4px;
      transition: background 0.2s;
    }

    .btn-delete:hover {
      background: #fee2e2;
    }

    /* 빈 상태 안내 */
    .empty-state {
      padding: 48px 20px;
      text-align: center;
      color: var(--text-muted);
    }

    .empty-state i {
      font-size: 2.5rem;
      color: #cbd5e1;
      margin-bottom: 12px;
    }

    .empty-state p {
      font-size: 0.95rem;
      font-weight: 500;
    }

    /* 모달 스타일 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s ease;
      padding: 16px;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-card {
      background: #ffffff;
      border-radius: 12px;
      width: 100%;
      max-width: 540px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      transform: translateY(20px);
      transition: transform 0.25s ease;
    }

    .modal-overlay.active .modal-card {
      transform: translateY(0);
    }

    .modal-header {
      background: var(--primary-color);
      color: #ffffff;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-header h3 {
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-close-btn {
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 1.25rem;
      cursor: pointer;
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    .modal-close-btn:hover {
      opacity: 1;
    }

    .modal-body {
      padding: 24px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 0.9rem;
      font-weight: 700;
      color: #334155;
      margin-bottom: 6px;
    }

    .form-label .step-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      background: var(--primary-light);
      color: var(--primary-color);
      border-radius: 50%;
      font-size: 0.75rem;
      margin-right: 6px;
    }

    .form-control {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-control:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(0, 107, 103, 0.12);
    }

    /* 교시 선택 칩 버튼들 */
    .period-chips {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .period-chip {
      text-align: center;
      padding: 8px 0;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #f8fafc;
      font-size: 0.85rem;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .period-chip.selected {
      background: var(--primary-color);
      color: #ffffff;
      border-color: var(--primary-color);
      box-shadow: 0 2px 4px rgba(0, 107, 103, 0.2);
    }

    /* 학급 드롭다운 및 그리드 */
    .class-select-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* 사유 태그 버튼 */
    .reason-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .reason-tag {
      font-size: 0.8rem;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: #475569;
      padding: 4px 10px;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .reason-tag:hover {
      background: var(--primary-light);
      border-color: var(--primary-border);
      color: var(--primary-color);
    }

    .modal-footer {
      padding: 16px 24px;
      background: #f8fafc;
      border-top: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
    }

    /* 로딩 스피너 */
    .spinner {
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top: 3px solid #ffffff;
      width: 16px;
      height: 16px;
      animation: spin 0.8s linear infinite;
      display: inline-block;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* 반응형 레이아웃 */
    @media (max-width: 768px) {
      .app-title { font-size: 1.5rem; }
      .control-panel { flex-direction: column; align-items: stretch; }
      .left-controls { justify-content: space-between; }
      .period-chips { grid-template-columns: repeat(4, 1fr); }
      .schedule-table th, .schedule-table td { padding: 10px 8px; font-size: 0.85rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 헤더 영역 -->
    <header class="app-header">
      <h1 class="app-title">
        <i class="fa-solid fa-clipboard-user"></i> 홍익-보강 알리미
      </h1>
      <div class="app-subtitle">온라인 교무실 보강 현황판</div>
      <div class="notice-banner">
        <i class="fa-solid fa-circle-info"></i> ※ 보강 정보 등록 및 삭제는 모든 선생님께서 자유롭게 작성하실 수 있습니다.
      </div>
    </header>

    <!-- 상단 조작 패널 -->
    <section class="control-panel">
      <div class="left-controls">
        <div class="date-picker-wrap">
          <i class="fa-regular fa-calendar-days" style="color: var(--primary-color);"></i>
          <input type="date" id="filterDate" onchange="loadRecords()">
        </div>
        <button class="btn btn-outline btn-sm" onclick="setTodayDate()">
          <i class="fa-solid fa-clock"></i> 오늘
        </button>
        <button class="btn btn-outline btn-sm" onclick="setAllDate()">
          <i class="fa-solid fa-list"></i> 전체 보기
        </button>
      </div>

      <div style="display: flex; gap: 10px; align-items: center;">
        <div class="search-wrap">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="searchInput" placeholder="교사명 또는 학급 검색" onkeyup="filterTable()">
        </div>
        <button class="btn btn-primary" onclick="openAddModal()">
          <i class="fa-solid fa-plus"></i> 보강 등록하기
        </button>
      </div>
    </section>

    <!-- 메인 보강 지도표 카드 (첨부 이미지 교사 지도표 스타일 반영) -->
    <main class="table-card">
      <div class="table-header-title">
        <span><i class="fa-solid fa-table-list" style="color: var(--primary-color);"></i> 교사 보강 지도표</span>
        <span id="currentDateLabel" style="font-size: 0.9rem; font-weight: 500; color: #64748b;"></span>
      </div>

      <div class="table-responsive">
        <table class="schedule-table">
          <thead>
            <tr>
              <th style="width: 14%;">날짜(요일)</th>
              <th style="width: 10%;">교시</th>
              <th style="width: 14%;">학급</th>
              <th style="width: 18%;">결강 교사 (원교사)</th>
              <th style="width: 18%;">보강 교사</th>
              <th style="width: 18%;">보강 사유</th>
              <th style="width: 8%;">삭제</th>
            </tr>
          </thead>
          <tbody id="recordTableBody">
            <!-- JavaScript 데이터 동적 삽입 영역 -->
          </tbody>
        </table>

        <!-- 빈 상태 표시 -->
        <div id="emptyState" class="empty-state" style="display: none;">
          <i class="fa-regular fa-folder-open"></i>
          <p id="emptyStateText">등록된 보강 내역이 없습니다.</p>
        </div>
      </div>
    </main>
  </div>

  <!-- 보강 등록 모달 팝업 -->
  <div class="modal-overlay" id="addModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3><i class="fa-solid fa-pen-to-square"></i> 신규 보강 내역 등록</h3>
        <button class="modal-close-btn" onclick="closeAddModal()">&times;</button>
      </div>
      
      <form id="addForm" onsubmit="handleFormSubmit(event)">
        <div class="modal-body">
          
          <!-- 1단계: 날짜 지정 -->
          <div class="form-group">
            <label class="form-label">
              <span class="step-num">1</span> 날짜 지정
            </label>
            <input type="date" class="form-control" id="inputDate" required>
          </div>

          <!-- 2단계: 교시 선택 -->
          <div class="form-group">
            <label class="form-label">
              <span class="step-num">2</span> 교시 선택 (1~7교시)
            </label>
            <div class="period-chips" id="periodChips">
              <div class="period-chip selected" onclick="selectPeriod(1)">1교시</div>
              <div class="period-chip" onclick="selectPeriod(2)">2교시</div>
              <div class="period-chip" onclick="selectPeriod(3)">3교시</div>
              <div class="period-chip" onclick="selectPeriod(4)">4교시</div>
              <div class="period-chip" onclick="selectPeriod(5)">5교시</div>
              <div class="period-chip" onclick="selectPeriod(6)">6교시</div>
              <div class="period-chip" onclick="selectPeriod(7)">7교시</div>
            </div>
            <input type="hidden" id="inputPeriod" value="1교시">
          </div>

          <!-- 3단계: 학급 선택 -->
          <div class="form-group">
            <label class="form-label">
              <span class="step-num">3</span> 학급 선택
            </label>
            <div class="class-select-grid">
              <select class="form-control" id="inputGrade" onchange="updateClassOptions()">
                <option value="1학년">1학년</option>
                <option value="2학년">2학년</option>
                <option value="3학년">3학년</option>
              </select>
              <select class="form-control" id="inputClass">
                <!-- 1반 ~ 9반 옵션 동적 생성 -->
              </select>
            </div>
          </div>

          <!-- 4단계: 교사 이름 텍스트 직접 입력 및 사유 -->
          <div class="form-group">
            <label class="form-label">
              <span class="step-num">4</span> 결강 교사 (원교사 이름 입력)
            </label>
            <input type="text" class="form-control" id="inputOriginalTeacher" placeholder="예: 홍길동" required>
          </div>

          <div class="form-group">
            <label class="form-label">
              <span class="step-num">5</span> 보강 교사 (보강 들어갈 교사 이름 입력)
            </label>
            <input type="text" class="form-control" id="inputSubstituteTeacher" placeholder="예: 김철수" required>
          </div>

          <div class="form-group">
            <label class="form-label">
              <span class="step-num">6</span> 보강 유발 사유
            </label>
            <input type="text" class="form-control" id="inputReason" placeholder="예: 관외 출장, 연가 등" required>
            <div class="reason-tags">
              <span class="reason-tag" onclick="setReason('출장')">#출장</span>
              <span class="reason-tag" onclick="setReason('연가')">#연가</span>
              <span class="reason-tag" onclick="setReason('병가')">#병가</span>
              <span class="reason-tag" onclick="setReason('공가')">#공가</span>
              <span class="reason-tag" onclick="setReason('특별휴가')">#특별휴가</span>
              <span class="reason-tag" onclick="setReason('조퇴/외출')">#조퇴/외출</span>
            </div>
          </div>

        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-outline" onclick="closeAddModal()">취소</button>
          <button type="submit" class="btn btn-primary" id="btnSubmit">
            <span id="btnSubmitText">등록하기</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // 전역 상태 변수
    let currentRecords = [];
    let isGasEnvironment = typeof google !== 'undefined' && google.script && google.script.run;

    // 모의(Mock) 데이터 (로컬 브라우저 테스트 및 가스 미연결 시 사용)
    const mockData = [
      { id: 'SUB-1', date: '2026-09-02', period: '2교시', className: '1학년 3반', originalTeacher: '홍길동', substituteTeacher: '김철수', reason: '출장' },
      { id: 'SUB-2', date: '2026-09-02', period: '3교시', className: '2학년 5반', originalTeacher: '이영희', substituteTeacher: '박민수', reason: '연가' },
      { id: 'SUB-3', date: '2026-09-03', period: '5교시', className: '3학년 1반', originalTeacher: '강감찬', substituteTeacher: '최무선', reason: '공가' }
    ];

    // 페이지 로드 초기화
    document.addEventListener('DOMContentLoaded', function() {
      initDates();
      initClassOptions();
      loadRecords();
    });

    // 오늘 날짜 세팅
    function initDates() {
      const todayStr = getTodayString();
      document.getElementById('filterDate').value = todayStr;
      document.getElementById('inputDate').value = todayStr;
    }

    function getTodayString() {
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const day = String(today.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function setTodayDate() {
      const todayStr = getTodayString();
      document.getElementById('filterDate').value = todayStr;
      loadRecords();
    }

    function setAllDate() {
      document.getElementById('filterDate').value = '';
      loadRecords();
    }

    // 학급 옵션 동적 생성 (1반 ~ 9반)
    function initClassOptions() {
      const classSelect = document.getElementById('inputClass');
      classSelect.innerHTML = '';
      for (let i = 1; i <= 9; i++) {
        const option = document.createElement('option');
        option.value = `${i}반`;
        option.textContent = `${i}반`;
        classSelect.appendChild(option);
      }
    }

    function updateClassOptions() {
      // 학년 변경 시 추가 처리 필 필요 시 구현
    }

    // 교시 칩 선택
    function selectPeriod(periodNum) {
      const chips = document.querySelectorAll('.period-chip');
      chips.forEach((chip, idx) => {
        if (idx === periodNum - 1) {
          chip.classList.add('selected');
        } else {
          chip.classList.remove('selected');
        }
      });
      document.getElementById('inputPeriod').value = `${periodNum}교시`;
    }

    // 사유 태그 클릭 시 텍스트 채우기
    function setReason(reasonText) {
      document.getElementById('inputReason').value = reasonText;
    }

    // 보강 내역 불러오기
    function loadRecords() {
      const filterDate = document.getElementById('filterDate').value || 'ALL';
      updateDateLabel(filterDate);

      if (isGasEnvironment) {
        google.script.run
          .withSuccessHandler(function(records) {
            currentRecords = records;
            renderTable(currentRecords);
          })
          .withFailureHandler(function(err) {
            alert('데이터를 불러오는데 실패했습니다: ' + err.message);
          })
          .getSubstitutionRecords(filterDate);
      } else {
        // 모의(Mock) 데이터 필터링
        setTimeout(() => {
          if (filterDate === 'ALL') {
            currentRecords = [...mockData];
          } else {
            currentRecords = mockData.filter(r => r.date === filterDate);
          }
          renderTable(currentRecords);
        }, 100);
      }
    }

    function updateDateLabel(filterDate) {
      const label = document.getElementById('currentDateLabel');
      if (!filterDate || filterDate === 'ALL') {
        label.textContent = '[ 전체 기간 조회 ]';
      } else {
        const dayOfWeek = getDayOfWeekString(filterDate);
        label.textContent = `[ ${filterDate} (${dayOfWeek}) 보강 현황 ]`;
      }
    }

    function getDayOfWeekString(dateStr) {
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      const d = new Date(dateStr);
      return days[d.getDay()] || '';
    }

    // 테이블 렌더링
    function renderTable(records) {
      const tbody = document.getElementById('recordTableBody');
      const emptyState = document.getElementById('emptyState');
      tbody.innerHTML = '';

      if (!records || records.length === 0) {
        emptyState.style.display = 'block';
        return;
      }

      emptyState.style.display = 'none';

      records.forEach(item => {
        const tr = document.createElement('tr');
        const dayOfWeek = getDayOfWeekString(item.date);
        
        tr.innerHTML = `
          <td style="font-weight: 600;">${item.date} (${dayOfWeek})</td>
          <td><span class="badge-period">${item.period}</span></td>
          <td><span class="badge-class">${item.className}</span></td>
          <td><span class="teacher-orig">${escapeHtml(item.originalTeacher)}</span></td>
          <td>
            <div class="teacher-flow">
              <i class="fa-solid fa-arrow-right arrow-icon"></i>
              <span class="teacher-sub">${escapeHtml(item.substituteTeacher)}</span>
            </div>
          </td>
          <td><span class="badge-reason">${escapeHtml(item.reason)}</span></td>
          <td>
            <button class="btn-delete" title="삭제" onclick="deleteRecord('${item.id}')">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 테이블 실시간 필터링
    function filterTable() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      if (!query) {
        renderTable(currentRecords);
        return;
      }

      const filtered = currentRecords.filter(r => {
        return r.originalTeacher.toLowerCase().includes(query) ||
               r.substituteTeacher.toLowerCase().includes(query) ||
               r.className.toLowerCase().includes(query) ||
               r.reason.toLowerCase().includes(query);
      });

      renderTable(filtered);
    }

    // 모달 제어
    function openAddModal() {
      document.getElementById('addModal').classList.add('active');
    }

    function closeAddModal() {
      document.getElementById('addModal').classList.remove('active');
    }

    // 폼 제출 처리
    function handleFormSubmit(e) {
      e.preventDefault();

      const date = document.getElementById('inputDate').value;
      const period = document.getElementById('inputPeriod').value;
      const grade = document.getElementById('inputGrade').value;
      const classNum = document.getElementById('inputClass').value;
      const originalTeacher = document.getElementById('inputOriginalTeacher').value.trim();
      const substituteTeacher = document.getElementById('inputSubstituteTeacher').value.trim();
      const reason = document.getElementById('inputReason').value.trim();

      if (!date || !period || !originalTeacher || !substituteTeacher) {
        alert('필수 정보를 모두 입력해 주세요.');
        return;
      }

      const record = {
        date: date,
        period: period,
        className: `${grade} ${classNum}`,
        originalTeacher: originalTeacher,
        substituteTeacher: substituteTeacher,
        reason: reason || '사유 없음'
      };

      setSubmittingState(true);

      if (isGasEnvironment) {
        google.script.run
          .withSuccessHandler(function(res) {
            setSubmittingState(false);
            if (res.success) {
              closeAddModal();
              resetForm();
              // 입력한 날짜로 조회 필터 변경 후 리로드
              document.getElementById('filterDate').value = date;
              loadRecords();
            } else {
              alert('저장 실패: ' + res.message);
            }
          })
          .withFailureHandler(function(err) {
            setSubmittingState(false);
            alert('저장 중 오류가 발생했습니다: ' + err.message);
          })
          .addSubstitutionRecord(record);
      } else {
        // 모의(Mock) 저장
        setTimeout(() => {
          setSubmittingState(false);
          const newId = 'SUB-' + Date.now();
          mockData.unshift({ id: newId, ...record });
          closeAddModal();
          resetForm();
          document.getElementById('filterDate').value = date;
          loadRecords();
        }, 300);
      }
    }

    function setSubmittingState(isSubmitting) {
      const btn = document.getElementById('btnSubmit');
      const textSpan = document.getElementById('btnSubmitText');
      if (isSubmitting) {
        btn.disabled = true;
        textSpan.innerHTML = `<span class="spinner"></span> 저장 중...`;
      } else {
        btn.disabled = false;
        textSpan.innerHTML = `등록하기`;
      }
    }

    function resetForm() {
      document.getElementById('inputOriginalTeacher').value = '';
      document.getElementById('inputSubstituteTeacher').value = '';
      document.getElementById('inputReason').value = '';
      selectPeriod(1);
    }

    // 삭제 처리
    function deleteRecord(id) {
      if (!confirm('해당 보강 내역을 삭제하시겠습니까?')) return;

      if (isGasEnvironment) {
        google.script.run
          .withSuccessHandler(function(res) {
            if (res.success) {
              loadRecords();
            } else {
              alert('삭제 실패: ' + res.message);
            }
          })
          .withFailureHandler(function(err) {
            alert('삭제 시 오류가 발생했습니다: ' + err.message);
          })
          .deleteSubstitutionRecord(id);
      } else {
        const idx = mockData.findIndex(r => r.id === id);
        if (idx !== -1) mockData.splice(idx, 1);
        loadRecords();
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
