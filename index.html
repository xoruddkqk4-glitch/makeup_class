<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>보강 알리미 | 온라인 교무실</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary-color: #006b67;       /* 보강 목록 헤더 청록색 */
      --primary-hover: #00524f;
      --primary-light: #e6f4f1;       /* 테이블 짝수행 연한 민트 */
      --primary-border: #b2dfdb;
      --accent-color: #0d9488;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --bg-canvas: #f8fafc;
      --card-bg: #ffffff;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.1);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-main);
      line-height: 1.5;
      padding: 16px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* 상단 대시보드 헤더 (컴팩트) */
    .app-header {
      text-align: center;
      margin-bottom: 12px;
      padding-bottom: 0;
    }

    .app-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--primary-color);
      letter-spacing: -0.5px;
      margin-bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    /* 보강 목록 테이블 컨테이너 및 통합 툴바 */
    .table-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      border: 1px solid #cbd5e1;
      overflow: hidden;
    }

    .table-header-title {
      background: #f1f5f9;
      padding: 8px 12px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      flex-wrap: nowrap; /* 2줄 줄바꿈 금지 */
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      overflow-x: auto;
    }

    .header-controls-left {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .header-controls-right {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .header-title-text {
      font-size: 1rem;
      font-weight: 700;
      color: #1e293b;
      margin-right: 2px;
      white-space: nowrap;
    }

    #currentDateLabel {
      font-size: 0.775rem; /* 텍스트 크기 축소 */
      font-weight: 500;
      color: #64748b;
      white-space: nowrap;
    }

    .range-picker-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .range-picker-wrap input[type="date"] {
      border: none;
      background: transparent;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-main);
      outline: none;
      cursor: pointer;
    }

    .date-separator {
      font-weight: 700;
      color: #64748b;
      font-size: 0.85rem;
    }

    .btn-group {
      display: flex;
      gap: 4px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-primary {
      background-color: var(--primary-color);
      color: #ffffff;
      box-shadow: 0 2px 4px rgba(0, 107, 103, 0.25);
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-outline {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #334155;
    }

    .btn-outline:hover {
      background: #f1f5f9;
      border-color: #94a3b8;
    }

    .btn-sm {
      padding: 4px 8px;
      font-size: 0.8rem;
    }

    .btn-sm.active {
      background: var(--primary-light);
      border-color: var(--primary-color);
      color: var(--primary-color);
    }

    .table-responsive {
      width: 100%;
      overflow-x: auto;
    }

    .schedule-table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
    }

    .schedule-table th {
      background-color: var(--primary-color);
      color: #ffffff;
      font-weight: 600;
      font-size: 0.925rem;
      padding: 12px 8px;
      border: 1px solid #005753;
      white-space: nowrap;
    }

    /* 열별 개별 필터 헤더 행 */
    .filter-header-row th {
      background-color: #f8fafc;
      padding: 6px;
      border: 1px solid #e2e8f0;
    }

    .col-filter-input, .col-filter-select {
      width: 100%;
      padding: 5px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-size: 0.825rem;
      outline: none;
      background: #ffffff;
      color: var(--text-main);
      transition: border-color 0.2s;
    }

    .col-filter-input:focus, .col-filter-select:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 2px rgba(0, 107, 103, 0.15);
    }

    .schedule-table td {
      padding: 12px 8px;
      border: 1px solid #e2e8f0;
      font-size: 0.925rem;
      color: var(--text-main);
      vertical-align: middle;
    }

    .schedule-table tr:nth-child(even) {
      background-color: var(--primary-light);
    }

    .schedule-table tr:hover {
      background-color: #d1ebe5;
    }

    /* 뱃지 및 스타일링 */
    .badge-period {
      display: inline-block;
      background: #0284c7;
      color: #fff;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 12px;
    }

    .badge-class {
      display: inline-block;
      background: #475569;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 6px;
    }

    .teacher-sub {
      color: #047857;
      font-weight: 700;
      font-size: 1.02rem;
    }

    /* 보강 교사 열 특별 시각화 강조 스타일 */
    .schedule-table th.th-highlight-sub {
      background: linear-gradient(135deg, #047857 0%, #065f46 100%) !important;
      color: #ffffff;
      font-size: 0.95rem;
      border: 1px solid #064e3b !important;
      box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.15);
    }

    .schedule-table td.td-highlight-sub {
      background-color: #ecfdf5 !important; /* 연한 에메랄드 은은한 배경 강조 */
      border-left: 2px solid #059669 !important;
      border-right: 2px solid #059669 !important;
    }

    .sub-teacher-card {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #ffffff;
      border: 1.5px solid #059669;
      border-radius: 20px;
      padding: 4px 10px;
      box-shadow: 0 2px 5px rgba(5, 150, 105, 0.18);
      transition: all 0.2s ease;
      cursor: pointer;
      user-select: none;
    }

    .sub-teacher-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 8px rgba(5, 150, 105, 0.25);
    }

    .sub-teacher-card.is-confirmed {
      background: #d1fae5 !important;
      border-color: #10b981 !important;
      box-shadow: 0 2px 6px rgba(16, 185, 129, 0.25);
    }

    .sub-checkbox {
      width: 16px;
      height: 16px;
      accent-color: #059669;
      cursor: pointer;
      margin-right: 1px;
    }

    .sub-teacher-card .sub-icon {
      color: #059669;
      font-size: 0.95rem;
    }

    .sub-teacher-card .sub-name {
      font-size: 1.05rem;
      font-weight: 800;
      color: #065f46;
      letter-spacing: -0.2px;
    }

    .sub-teacher-card .sub-badge {
      background: #fef08a;
      color: #854d0e;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 10px;
      margin-left: 2px;
      white-space: nowrap;
    }

    .sub-teacher-card.is-confirmed .sub-badge {
      background: #059669 !important;
      color: #ffffff !important;
    }

    .col-filter-highlight {
      border-color: #059669 !important;
      background: #f0fdf4 !important;
      font-weight: 600;
    }

    .teacher-orig {
      color: #e11d48;
      font-weight: 600;
    }

    .badge-reason {
      display: inline-block;
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
    }

    /* 작업 전용 아이콘 버튼 */
    .action-btns {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }

    .btn-icon-edit {
      background: #eff6ff;
      color: #2563eb;
      border-color: #bfdbfe;
    }

    .btn-icon-edit:hover {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
      box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
    }

    .btn-icon-delete {
      background: #fef2f2;
      color: #ef4444;
      border-color: #fecaca;
    }

    .btn-icon-delete:hover {
      background: #ef4444;
      color: #ffffff;
      border-color: #ef4444;
      box-shadow: 0 2px 4px rgba(239, 68, 68, 0.2);
    }

    /* 빈 상태 */
    .empty-state {
      padding: 48px 20px;
      text-align: center;
      color: var(--text-muted);
    }

    .empty-state i {
      font-size: 2.5rem;
      color: #cbd5e1;
      margin-bottom: 12px;
    }

    .empty-state p {
      font-size: 0.95rem;
      font-weight: 500;
    }

    /* 모달 스타일 (가로 확장 & 세로 축소 2열 배치) */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s ease;
      padding: 12px;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-card {
      background: #ffffff;
      border-radius: 12px;
      width: 100%;
      max-width: 800px; /* 기존 540px -> 800px 가로 확장 */
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      transform: translateY(15px);
      transition: transform 0.25s ease;
      display: flex;
      flex-direction: column;
      max-height: 90vh;
    }

    .modal-overlay.active .modal-card {
      transform: translateY(0);
    }

    .modal-header {
      background: var(--primary-color);
      color: #ffffff;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-header h3 {
      font-size: 1.05rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-close-btn {
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 1.25rem;
      cursor: pointer;
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    .modal-close-btn:hover { opacity: 1; }

    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
    }

    /* 2열 폼 그리드 배치 (세로 길이 대폭 단축) */
    .modal-form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 20px;
    }

    .form-group {
      margin-bottom: 10px;
    }

    .form-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.9rem;
      font-weight: 700;
      color: #334155;
      margin-bottom: 6px;
    }

    .form-label .step-title {
      display: flex;
      align-items: center;
    }

    .form-label .step-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      background: var(--primary-light);
      color: var(--primary-color);
      border-radius: 50%;
      font-size: 0.75rem;
      margin-right: 6px;
    }

    .form-control {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-control:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(0, 107, 103, 0.12);
    }

    /* 교시 선택 칩 */
    .period-chips {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .period-chip {
      text-align: center;
      padding: 8px 0;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #f8fafc;
      font-size: 0.85rem;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .period-chip.selected {
      background: var(--primary-color);
      color: #ffffff;
      border-color: var(--primary-color);
      box-shadow: 0 2px 4px rgba(0, 107, 103, 0.2);
    }

    .class-select-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* 사유 태그 관리 스타일 */
    .reason-tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .reason-chip-tag {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.8rem;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: #475569;
      padding: 4px 10px;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }

    .reason-chip-tag:hover {
      background: var(--primary-light);
      border-color: var(--primary-border);
      color: var(--primary-color);
    }

    .reason-chip-tag .btn-tag-del {
      font-size: 0.75rem;
      color: #94a3b8;
      border-radius: 50%;
      width: 14px;
      height: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-left: 2px;
    }

    .reason-chip-tag .btn-tag-del:hover {
      color: #ef4444;
      background: #fee2e2;
    }

    .btn-add-tag-chip {
      font-size: 0.8rem;
      background: #ffffff;
      border: 1px dashed var(--primary-color);
      color: var(--primary-color);
      padding: 4px 10px;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.15s ease;
    }

    .btn-add-tag-chip:hover {
      background: var(--primary-light);
    }

    .modal-footer {
      padding: 16px 24px;
      background: #f8fafc;
      border-top: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
    }

    .spinner {
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top: 3px solid #ffffff;
      width: 16px;
      height: 16px;
      animation: spin 0.8s linear infinite;
      display: inline-block;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
      .app-title { font-size: 1.6rem; }
      .control-panel { flex-direction: column; align-items: stretch; }
      .left-controls { flex-direction: column; align-items: stretch; }
      .period-chips { grid-template-columns: repeat(4, 1fr); }
      .schedule-table th, .schedule-table td { padding: 10px 4px; font-size: 0.825rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 헤더 영역 (제목만 컴팩트하게 남김) -->
    <header class="app-header">
      <h1 class="app-title">
        <i class="fa-solid fa-clipboard-user"></i> 보강 알리미
      </h1>
    </header>

    <!-- 메인 보강 목록 테이블 (통합 툴바 적용) -->
    <main class="table-card">
      <div class="table-header-title">
        <div class="header-controls-left">
          <span class="header-title-text"><i class="fa-solid fa-table-list" style="color: var(--primary-color);"></i> 보강 목록</span>
          
          <div class="range-picker-wrap">
            <i class="fa-regular fa-calendar-days" style="color: var(--primary-color);"></i>
            <input type="date" id="filterStartDate">
            <span class="date-separator">~</span>
            <input type="date" id="filterEndDate">
          </div>

          <button class="btn btn-outline btn-sm" onclick="loadRecords()">
            <i class="fa-solid fa-magnifying-glass"></i> 조회
          </button>

          <div class="btn-group">
            <button class="btn btn-outline btn-sm" id="btnToday" onclick="setTodayDate()">오늘</button>
            <button class="btn btn-outline btn-sm" id="btnThisWeek" onclick="setThisWeekDate()">이번 주</button>
            <button class="btn btn-outline btn-sm" id="btnThisMonth" onclick="setThisMonthDate()">이번 달</button>
            <button class="btn btn-outline btn-sm" id="btnAll" onclick="setAllDate()">전체 보기</button>
          </div>
        </div>

        <div class="header-controls-right">
          <span id="currentDateLabel"></span>
          <button class="btn btn-primary btn-sm" onclick="openAddModal()">
            <i class="fa-solid fa-plus"></i> 보강 등록하기
          </button>
        </div>
      </div>

      <div class="table-responsive">
        <table class="schedule-table">
          <thead>
            <tr>
          <thead>
            <tr>
              <th style="width: 16%;">날짜(요일)</th>
              <th style="width: 10%;">교시</th>
              <th style="width: 15%;">교실</th>
              <th class="th-highlight-sub" style="width: 22%;">
                <i class="fa-solid fa-bell-concierge" style="color: #fde047; margin-right: 4px;"></i> 보강 교사 (알림)
              </th>
              <th style="width: 15%;">결강 교사(원교사)</th>
              <th style="width: 15%;">보강 사유</th>
              <th style="width: 7%;">작업</th>
            </tr>
            <!-- 열별 개별 필터 헤더 행 (원교사 <-> 보강사유 순서 변경) -->
            <tr class="filter-header-row">
              <th><!-- 날짜 열 빈칸 --></th>
              <th>
                <select class="col-filter-select" id="filterColPeriod" onchange="applyColumnFilters()">
                  <option value="">전체 교시</option>
                  <option value="1교시">1교시</option>
                  <option value="2교시">2교시</option>
                  <option value="3교시">3교시</option>
                  <option value="4교시">4교시</option>
                  <option value="5교시">5교시</option>
                  <option value="6교시">6교시</option>
                  <option value="7교시">7교시</option>
                </select>
              </th>
              <th>
                <!-- 층별 및 교실별 드롭다운 선택 (4층 -> 3층 -> 2층 -> 1층 -> 지하 순) -->
                <select class="col-filter-select" id="filterColClass" onchange="applyColumnFilters()">
                  <option value="">전체 교실</option>
                  <optgroup label="4층">
                    <option value="4층">4층 전체</option>
                    <option value="401">401</option>
                    <option value="402">402</option>
                    <option value="403">403</option>
                    <option value="404">404</option>
                    <option value="405">405</option>

  <script>
    let currentRecords = [];
    let isGasEnvironment = typeof google !== 'undefined' && google.script && google.script.run;

    // 기본 보강 사유 태그 목록 (조퇴, 외출 분리 완료)
    const DEFAULT_REASON_TAGS = ['출장', '연가', '병가', '공가', '특별휴가', '조퇴', '외출'];
    let reasonTags = [];

    // 모의(Mock) 데이터 (로컬 테스트용)
    const mockData = [
      { id: 'SUB-1', date: '2026-09-02', period: '2교시', className: '203', originalTeacher: '홍길동', substituteTeacher: '김철수', reason: '출장' },
      { id: 'SUB-2', date: '2026-09-02', period: '3교시', className: '105', originalTeacher: '이영희', substituteTeacher: '박민수', reason: '연가' },
      { id: 'SUB-3', date: '2026-09-03', period: '5교시', className: '312', originalTeacher: '강감찬', substituteTeacher: '최무선', reason: '공가' }
    ];

    document.addEventListener('DOMContentLoaded', function() {
      initReasonTags();
      updateRoomOptions();
      setTodayDate();
    });

    // 사유 태그 초기화 및 로컬스토리지 관리
    function initReasonTags() {
      const saved = localStorage.getItem('custom_reason_tags');
      if (saved) {
        try {
          reasonTags = JSON.parse(saved);
        } catch (e) {
          reasonTags = [...DEFAULT_REASON_TAGS];
        }
      } else {
        reasonTags = [...DEFAULT_REASON_TAGS];
      }
      renderReasonTags();
      populateReasonFilterDropdown();
    }

    function saveReasonTags() {
      localStorage.setItem('custom_reason_tags', JSON.stringify(reasonTags));
      renderReasonTags();
      populateReasonFilterDropdown();
    }

    function renderReasonTags() {
      const container = document.getElementById('reasonTagsContainer');
      container.innerHTML = '';

      reasonTags.forEach(tag => {
        const chip = document.createElement('span');
        chip.className = 'reason-chip-tag';
        chip.innerHTML = `#${escapeHtml(tag)} <span class="btn-tag-del" title="태그 삭제" onclick="deleteReasonTag(event, '${escapeHtml(tag)}')">&times;</span>`;
        chip.onclick = function() {
          setReason(tag);
        };
        container.appendChild(chip);
      });

      // 태그 추가 버튼
      const addBtn = document.createElement('span');
      addBtn.className = 'btn-add-tag-chip';
      addBtn.innerHTML = `<i class="fa-solid fa-plus"></i> 태그 추가`;
      addBtn.onclick = function(e) {
        e.stopPropagation();
        addNewReasonTag();
      };
      container.appendChild(addBtn);
    }

    function addNewReasonTag() {
      const newTag = prompt('새로 추가할 보강 사유 태그를 입력하세요:');
      if (newTag && newTag.trim()) {
        const cleanTag = newTag.trim();
        if (!reasonTags.includes(cleanTag)) {
          reasonTags.push(cleanTag);
          saveReasonTags();
        }
      }
    }

    function deleteReasonTag(e, tagToDelete) {
      e.stopPropagation();
      if (confirm(`'#${tagToDelete}' 태그를 삭제하시겠습니까?`)) {
        reasonTags = reasonTags.filter(t => t !== tagToDelete);
        saveReasonTags();
      }
    }

    // 사유 필터 드롭다운 채우기
    function populateReasonFilterDropdown() {
      const select = document.getElementById('filterColReason');
      const currentVal = select.value;
      select.innerHTML = '<option value="">전체 사유</option>';

      reasonTags.forEach(tag => {
        const opt = document.createElement('option');
        opt.value = tag;
        opt.textContent = tag;
        select.appendChild(opt);
      });

      select.value = currentVal;
    }

    function getTodayDateObj() {
      return new Date();
    }

    function formatDateToString(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function setActiveQuickBtn(activeId) {
      ['btnToday', 'btnThisWeek', 'btnThisMonth', 'btnAll'].forEach(id => {
        const btn = document.getElementById(id);
        if (btn) {
          if (id === activeId) btn.classList.add('active');
          else btn.classList.remove('active');
        }
      });
    }

    function setTodayDate() {
      const todayStr = formatDateToString(getTodayDateObj());
      document.getElementById('filterStartDate').value = todayStr;
      document.getElementById('filterEndDate').value = todayStr;
      document.getElementById('inputDate').value = todayStr;
      setActiveQuickBtn('btnToday');
      loadRecords();
    }

    function setThisWeekDate() {
      const now = getTodayDateObj();
      const dayOfWeek = now.getDay();
      const distanceToMon = (dayOfWeek === 0 ? -6 : 1 - dayOfWeek);
      
      const mon = new Date(now);
      mon.setDate(now.getDate() + distanceToMon);

      const sun = new Date(mon);
      sun.setDate(mon.getDate() + 6);

      document.getElementById('filterStartDate').value = formatDateToString(mon);
      document.getElementById('filterEndDate').value = formatDateToString(sun);
      setActiveQuickBtn('btnThisWeek');
      loadRecords();
    }

    function setThisMonthDate() {
      const now = getTodayDateObj();
      const firstDay = new Date(now.getFullYear(), now.getMonth(), 1);
      const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0);

      document.getElementById('filterStartDate').value = formatDateToString(firstDay);
      document.getElementById('filterEndDate').value = formatDateToString(lastDay);
      setActiveQuickBtn('btnThisMonth');
      loadRecords();
    }

    function setAllDate() {
      document.getElementById('filterStartDate').value = '';
      document.getElementById('filterEndDate').value = '';
      setActiveQuickBtn('btnAll');
      loadRecords();
    }

    // 층별 교실 동적 목록 생성 (B01-B14, 101-115, 201-216, 301-316, 401-416)
    function updateRoomOptions() {
      const floor = document.getElementById('inputFloor').value;
      const roomSelect = document.getElementById('inputRoom');
      roomSelect.innerHTML = '';

      let prefix = '';
      let end = 16;

      if (floor === '지하(B층)') {
        prefix = 'B';
        end = 14;
      } else if (floor === '1층') {
        prefix = '1';
        end = 15;
      } else if (floor === '2층') {
        prefix = '2';
        end = 16;
      } else if (floor === '3층') {
        prefix = '3';
        end = 16;
      } else if (floor === '4층') {
        prefix = '4';
        end = 16;
      }

      for (let i = 1; i <= end; i++) {
        const numStr = prefix + String(i).padStart(2, '0');
        const option = document.createElement('option');
        option.value = numStr;
        option.textContent = numStr;
        roomSelect.appendChild(option);
      }
    }

    function selectPeriod(periodNum) {
      const chips = document.querySelectorAll('.period-chip');
      chips.forEach((chip, idx) => {
        if (idx === periodNum - 1) {
          chip.classList.add('selected');
        } else {
          chip.classList.remove('selected');
        }
      });
      document.getElementById('inputPeriod').value = `${periodNum}교시`;
    }

    function setReason(reasonText) {
      document.getElementById('inputReason').value = reasonText;
    }

    // 보강 내역 불러오기
    function loadRecords() {
      const startDate = document.getElementById('filterStartDate').value;
      const endDate = document.getElementById('filterEndDate').value;
      
      updateDateLabel(startDate, endDate);

      if (isGasEnvironment) {
        google.script.run
          .withSuccessHandler(function(records) {
            currentRecords = records;
            applyColumnFilters();
          })
          .withFailureHandler(function(err) {
            alert('데이터를 불러오는데 실패했습니다: ' + err.message);
          })
          .getSubstitutionRecords(startDate || 'ALL', endDate);
      } else {
        setTimeout(() => {
          if (!startDate && !endDate) {
            currentRecords = [...mockData];
          } else if (startDate && endDate) {
            currentRecords = mockData.filter(r => r.date >= startDate && r.date <= endDate);
          } else if (startDate) {
            currentRecords = mockData.filter(r => r.date === startDate);
          } else {
            currentRecords = [...mockData];
          }
          applyColumnFilters();
        }, 100);
      }
    }

    function updateDateLabel(startDate, endDate) {
      const label = document.getElementById('currentDateLabel');
      if (!startDate && !endDate) {
        label.textContent = '[ 전체 목록 ]';
      } else if (startDate && endDate) {
        if (startDate === endDate) {
          label.textContent = `[ ${formatFormattedDate(startDate)} ]`;
        } else {
          label.textContent = `[ ${formatFormattedDate(startDate)} ~ ${formatFormattedDate(endDate)} ]`;
        }
      } else {
        label.textContent = `[ ${formatFormattedDate(startDate)} ]`;
      }
    }

    function formatFormattedDate(rawDateStr) {
      if (!rawDateStr) return '';
      let dateObj = null;

      const match = String(rawDateStr).trim().match(/^(\d{4})[-.\/]?(\d{2})[-.\/]?(\d{2})/);
      if (match) {
        const y = match[1];
        const m = match[2];
        const d = match[3];
        dateObj = new Date(parseInt(y), parseInt(m) - 1, parseInt(d));
        const days = ['일', '월', '화', '수', '목', '금', '토'];
        const dayStr = days[dateObj.getDay()];
        return `${y}-${m}-${d} (${dayStr})`;
      }

      dateObj = new Date(rawDateStr);
      if (!isNaN(dateObj.getTime())) {
        const y = dateObj.getFullYear();
        const m = String(dateObj.getMonth() + 1).padStart(2, '0');
        const d = String(dateObj.getDate()).padStart(2, '0');
        const days = ['일', '월', '화', '수', '목', '금', '토'];
        const dayStr = days[dateObj.getDay()];
        return `${y}-${m}-${d} (${dayStr})`;
      }

      return rawDateStr;
    }

    // 열별 개별 필터링 (층별 전체 및 교실별 필터 대응)
    function applyColumnFilters() {
      const periodQuery = document.getElementById('filterColPeriod').value.trim();
      const classQuery = document.getElementById('filterColClass').value.trim();
      const subTeacherQuery = document.getElementById('filterColSubTeacher').value.toLowerCase().trim();
      const reasonQuery = document.getElementById('filterColReason').value.toLowerCase().trim();
      const origTeacherQuery = document.getElementById('filterColOrigTeacher').value.toLowerCase().trim();

      const filtered = currentRecords.filter(r => {
        if (periodQuery && r.period !== periodQuery) return false;
        
        if (classQuery) {
          if (classQuery === 'B' || classQuery === '지하(B층)') {
            if (!String(r.className).startsWith('B')) return false;
          } else if (classQuery === '1층') {
            if (!String(r.className).startsWith('1')) return false;
          } else if (classQuery === '2층') {
            if (!String(r.className).startsWith('2')) return false;
          } else if (classQuery === '3층') {
            if (!String(r.className).startsWith('3')) return false;
          } else if (classQuery === '4층') {
            if (!String(r.className).startsWith('4')) return false;
          } else {
            if (!String(r.className).includes(classQuery)) return false;
          }
        }

        if (subTeacherQuery && !r.substituteTeacher.toLowerCase().includes(subTeacherQuery)) return false;
        if (reasonQuery && !r.reason.toLowerCase().includes(reasonQuery)) return false;
        if (origTeacherQuery && !r.originalTeacher.toLowerCase().includes(origTeacherQuery)) return false;
        return true;
      });

      renderTable(filtered);
    }

    function resetColumnFilters() {
      document.getElementById('filterColPeriod').value = '';
      document.getElementById('filterColClass').value = '';
      document.getElementById('filterColSubTeacher').value = '';
      document.getElementById('filterColReason').value = '';
      document.getElementById('filterColOrigTeacher').value = '';
      renderTable(currentRecords);
    }

    // 테이블 렌더링 (보강 교사 확인 체크박스 포함)
    function renderTable(records) {
      const tbody = document.getElementById('recordTableBody');
      const emptyState = document.getElementById('emptyState');
      tbody.innerHTML = '';

      if (!records || records.length === 0) {
        emptyState.style.display = 'block';
        return;
      }

      emptyState.style.display = 'none';

      records.forEach(item => {
        const tr = document.createElement('tr');
        const formattedDateText = formatFormattedDate(item.date);
        const isConf = Boolean(item.confirmed);
        
        tr.innerHTML = `
          <td style="font-weight: 600;">${formattedDateText}</td>
          <td><span class="badge-period">${escapeHtml(item.period)}</span></td>
          <td><span class="badge-class">${escapeHtml(item.className)}</span></td>
          <td class="td-highlight-sub">
            <div class="sub-teacher-card ${isConf ? 'is-confirmed' : ''}" title="${isConf ? '클릭 시 미확인으로 변경' : '클릭 시 본인확인 완료'}" onclick="toggleConfirm(event, '${item.id}')">
              <input type="checkbox" class="sub-checkbox" ${isConf ? 'checked' : ''} onclick="event.stopPropagation(); toggleConfirm(event, '${item.id}')">
              <i class="fa-solid ${isConf ? 'fa-circle-check' : 'fa-bell'} sub-icon" style="color: ${isConf ? '#059669' : '#d97706'};"></i>
              <span class="sub-name">${escapeHtml(item.substituteTeacher)}</span>
              <span class="sub-badge">${isConf ? '✅ 본인확인' : '🔔 미확인'}</span>
            </div>
          </td>
          <td><span class="teacher-orig">${escapeHtml(item.originalTeacher || '-')}</span></td>
          <td><span class="badge-reason">${escapeHtml(item.reason || '-')}</span></td>
          <td>
            <div class="action-btns">
              <button class="btn-icon btn-icon-edit" title="수정" onclick="openEditModal('${item.id}')">
                <i class="fa-solid fa-pen-to-square"></i>
              </button>
              <button class="btn-icon btn-icon-delete" title="삭제" onclick="deleteRecord('${item.id}')">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 보강 교사 명단 확인 체크박스 토글 함수 (낙관적 UI 적용)
    function toggleConfirm(e, id) {
      if (e) e.stopPropagation();

      const target = currentRecords.find(r => String(r.id) === String(id));
      if (!target) return;

      const newConfirmedState = !target.confirmed;
      target.confirmed = newConfirmedState;

      // 1. 화면 0초 즉시 업데이트
      applyColumnFilters();

      // 2. 백그라운드 구글 스프레드시트 DB 연동
      if (isGasEnvironment) {
        google.script.run
          .withFailureHandler(function(err) {
            console.error('확인 여부 저장 중 오류: ', err);
            loadRecords();
          })
          .toggleSubstituteConfirm(id, newConfirmedState);
      } else {
        const mockIdx = mockData.findIndex(r => String(r.id) === String(id));
        if (mockIdx !== -1) mockData[mockIdx].confirmed = newConfirmedState;
      }
    }

    // 모달 제어
    function openAddModal() {
      document.getElementById('editingRecordId').value = '';
      document.getElementById('modalTitle').innerHTML = `<i class="fa-solid fa-pen-to-square"></i> 보강 내역 등록`;
      document.getElementById('btnSubmitText').textContent = '등록하기';
      resetForm();
      document.getElementById('addModal').classList.add('active');
    }

    function openEditModal(id) {
      const target = currentRecords.find(r => String(r.id) === String(id));
      if (!target) return;

      document.getElementById('editingRecordId').value = target.id;
      document.getElementById('modalTitle').innerHTML = `<i class="fa-solid fa-pen-to-square"></i> 보강 내역 수정`;
      document.getElementById('btnSubmitText').textContent = '수정 완료';

      let dateVal = target.date;
      const match = String(target.date).match(/^(\d{4})[-.\/]?(\d{2})[-.\/]?(\d{2})/);
      if (match) dateVal = `${match[1]}-${match[2]}-${match[3]}`;
      document.getElementById('inputDate').value = dateVal;

      const periodNum = parseInt(target.period) || 1;
      selectPeriod(periodNum);

      const roomVal = String(target.className).trim();
      if (roomVal.startsWith('B')) {
        document.getElementById('inputFloor').value = '지하(B층)';
      } else if (roomVal.startsWith('1')) {
        document.getElementById('inputFloor').value = '1층';
      } else if (roomVal.startsWith('2')) {
        document.getElementById('inputFloor').value = '2층';
      } else if (roomVal.startsWith('3')) {
        document.getElementById('inputFloor').value = '3층';
      } else if (roomVal.startsWith('4')) {
        document.getElementById('inputFloor').value = '4층';
      }
      updateRoomOptions();
      document.getElementById('inputRoom').value = roomVal;

      document.getElementById('inputSubstituteTeacher').value = target.substituteTeacher;
      document.getElementById('inputReason').value = target.reason || '';
      document.getElementById('inputOriginalTeacher').value = target.originalTeacher || '';

      document.getElementById('addModal').classList.add('active');
    }

    function closeAddModal() {
      document.getElementById('addModal').classList.remove('active');
    }

    // 폼 제출 (낙관적 UI 적용: 즉시 화면 갱신 후 백그라운드 저장)
    function handleFormSubmit(e) {
      e.preventDefault();

      const editingId = document.getElementById('editingRecordId').value;
      const date = document.getElementById('inputDate').value;
      const period = document.getElementById('inputPeriod').value;
      const roomVal = document.getElementById('inputRoom').value;
      const substituteTeacher = document.getElementById('inputSubstituteTeacher').value.trim();
      const reason = document.getElementById('inputReason').value.trim();
      const originalTeacher = document.getElementById('inputOriginalTeacher').value.trim();

      // 1~4번만 필수 검증 (5~6번 선택 입력)
      if (!date || !period || !substituteTeacher) {
        alert('1~4번 필수 정보(날짜, 교시, 교실, 보강 교사)를 모두 입력해 주세요.');
        return;
      }

      const targetId = editingId || ('SUB-' + Date.now());
      const record = {
        id: targetId,
        date: date,
        period: period,
        className: roomVal,
        substituteTeacher: substituteTeacher,
        reason: reason || '',
        originalTeacher: originalTeacher || ''
      };

      // 1. 모달 즉시 닫기 & 로컬 UI 즉시 갱신 (0초 즉시 반응)
      closeAddModal();

      if (editingId) {
        const idx = currentRecords.findIndex(r => String(r.id) === String(editingId));
        if (idx !== -1) currentRecords[idx] = { ...record };
      } else {
        document.getElementById('filterStartDate').value = date;
        document.getElementById('filterEndDate').value = date;
        currentRecords.unshift({ ...record });
      }

      // 화면 즉시 리렌더링
      applyColumnFilters();

      // 2. 백그라운드 구글 스프레드시트 DB 동기화
      if (isGasEnvironment) {
        if (editingId) {
          google.script.run
            .withFailureHandler(function(err) {
              alert('수정 동기화 중 오류가 발생했습니다. 데이터를 재로드합니다: ' + err.message);
              loadRecords();
            })
            .updateSubstitutionRecord(record);
        } else {
          google.script.run
            .withFailureHandler(function(err) {
              alert('저장 동기화 중 오류가 발생했습니다. 데이터를 재로드합니다: ' + err.message);
              loadRecords();
            })
            .addSubstitutionRecord(record);
        }
      } else {
        if (editingId) {
          const idx = mockData.findIndex(r => r.id === editingId);
          if (idx !== -1) mockData[idx] = { ...record };
        } else {
          mockData.unshift({ ...record });
        }
      }
    }

    function setSubmittingState(isSubmitting, labelText) {
      const btn = document.getElementById('btnSubmit');
      const textSpan = document.getElementById('btnSubmitText');
      if (isSubmitting) {
        btn.disabled = true;
        textSpan.innerHTML = `<span class="spinner"></span> ${labelText}`;
      } else {
        btn.disabled = false;
        textSpan.innerHTML = document.getElementById('editingRecordId').value ? '수정 완료' : '등록하기';
      }
    }

    function resetForm() {
      const todayStr = formatDateToString(getTodayDateObj());
      document.getElementById('inputDate').value = todayStr;
      document.getElementById('inputFloor').value = '2층';
      updateRoomOptions();
      document.getElementById('inputSubstituteTeacher').value = '';
      document.getElementById('inputReason').value = '';
      document.getElementById('inputOriginalTeacher').value = '';
      selectPeriod(1);
    }

    function deleteRecord(id) {
      if (!confirm('해당 보강 내역을 삭제하시겠습니까?')) return;

      // 1. 화면에서 즉시 제거 (0초 즉시 반응)
      currentRecords = currentRecords.filter(r => String(r.id) !== String(id));
      applyColumnFilters();

      // 2. 백그라운드 DB 삭제 처리
      if (isGasEnvironment) {
        google.script.run
          .withFailureHandler(function(err) {
            alert('삭제 동기화 중 오류가 발생했습니다. 데이터를 재로드합니다: ' + err.message);
            loadRecords();
          })
          .deleteSubstitutionRecord(id);
      } else {
        const idx = mockData.findIndex(r => r.id === id);
        if (idx !== -1) mockData.splice(idx, 1);
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
